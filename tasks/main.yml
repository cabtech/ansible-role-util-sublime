---
- name: "Include variables wrapper"
  ansible.builtin.include_tasks:
    file: variables.yml
  tags: ["ct-sublime"]

- name: "Disto/Family tasks (FF)"
  ansible.builtin.include_tasks:
    file: "{{ lookup('ansible.builtin.first_found', params) }}"
  vars:
    params:
      files:
      - "{{ ansible_facts['distribution'] }}-{{ ansible_facts['distribution_major_version'].split('.')[0] }}.yml"
      - "{{ ansible_facts['distribution'] }}.yml"
      - "{{ ansible_facts['os_family'] }}.yml"
      - "default.yml"
  tags: ["ct-sublime"]

- name: 'Add GPG signing key for the Sublime Text repo'
  ansible.builtin.apt_key:
    url: '{{ sublime_gpg }}'
    validate_certs: true
    state: present
  become: true
  tags: ["ct-sublime"]

- name: 'Add Sublime Text repository to APT'
  ansible.builtin.apt_repository:
    repo: '{{ sublime_repo }}'
    state: present
    update_cache: true
    filename: sublime
  register: reg_repo
  become: true
  tags: ["ct-sublime"]

- name: 'Update apt cache and install Sublime Text'
  ansible.builtin.apt:
    name: '{{ sublime_pkg }}'
    update_cache: '{{ reg_repo is changed }}'
    state: '{{ sublime_state }}'
  become: true
  tags: ["ct-sublime"]
...
